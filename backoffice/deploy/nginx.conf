# nginx site for the trace back-office, behind Cloudflare (proxied DNS record, SSL mode "Full (strict)").
# Install as /etc/nginx/sites-available/tars-backoffice and link it into sites-enabled.
# Replace traces.example.com with the instance's host name.

# The client's address, from Cloudflare's header, only when the connection comes from Cloudflare.
# /etc/nginx/cloudflare-ips.conf holds one "set_real_ip_from <range>;" per range published at
# https://www.cloudflare.com/ips/ (OPERATIONS.md says how it is refreshed).
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name traces.example.com;

    # Cloudflare Origin CA certificate: trusted by Cloudflare only, which is all the origin needs.
    ssl_certificate     /etc/ssl/tars-backoffice/origin.pem;
    ssl_certificate_key /etc/ssl/tars-backoffice/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Authenticated Origin Pulls: only Cloudflare's own client certificate gets an answer, so the
    # origin refuses anyone who found its address, whatever the firewall says.
    ssl_client_certificate /etc/ssl/tars-backoffice/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # No access log: client addresses are not kept on the origin (the privacy notice says so).
    # Errors are still logged, without request bodies.
    access_log off;

    client_max_body_size 17m;          # the API's own limits are 8 MiB (batch) and 16 MiB (blob)
    client_body_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the edge client's address, after real_ip above
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}

# Nothing on port 80: Cloudflare redirects to https at the edge ("Always Use HTTPS").

name: CI - Linux (on demand)

# Run only when asked (Noah, 2026-10-15: Actions "que pour les tests spécifiques
# pour linux et windows, pas en permanence"). macOS stays local. What runs is
# what a Mac cannot prove: both type checks and the unit tests on a real Linux
# host, where the per-platform cases run unstubbed, and the specs that drive
# paths, processes, shells and file modes (npm run e2e:platform). Not the full
# E2E. When to run it, and the command: OPERATIONS.md, "Tests and guardrails".
#
#   gh workflow run ci.yml --ref main -f ref=<branch, or refs/pull/<n>/head>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to test: a branch, a tag, a commit, or refs/pull/<n>/head (empty: the ref the workflow runs from)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Electron 44 has no postinstall: its binary was downloaded by the first
      # test that loaded electron, and GitHub answered that download 500 or 503
      # twice on 01/10, which turned a green change red. Fetched up front, three
      # tries.
      - name: Install the Electron binary
        run: |
          for try in 1 2 3; do
            npx install-electron && exit 0
            echo "Electron's download failed (try $try of 3), trying again in 30 s"
            sleep 30
          done
          exit 1

      # Each check runs even when one before it failed, so one run says all it can.
      - name: Type check (renderer)
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Type check (main process)
        if: ${{ !cancelled() }}
        run: npx tsc -p electron/tsconfig.json

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # The real app on a virtual display; the main process was built above.
      - name: Platform specs
        if: ${{ !cancelled() }}
        env:
          E2E_TRACE: 'on'
        run: xvfb-run -a npm run e2e:platform

      - name: Upload the run artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-platform-linux
          path: test-results/runs/**
          retention-days: 7

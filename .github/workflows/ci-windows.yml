name: CI - Windows (on demand)

# Run only when asked (the maintainer, 2026-10-15: Actions "que pour les tests spécifiques
# pour linux et windows, pas en permanence"). macOS stays local. What runs is
# what a Mac cannot prove: both type checks and the unit tests on a real Windows
# host, where the per-platform cases run unstubbed, and the specs that drive
# paths, processes, shells and file modes (npm run e2e:platform, its two .win32
# specs included). Not the full E2E: the Windows screenshot references are
# refreshed by hand (OPERATIONS.md, E2E on Windows). When to run it, and the
# command: OPERATIONS.md, "Tests and guardrails".
#
#   gh workflow run ci-windows.yml --ref main -f ref=<branch, or refs/pull/<n>/head>
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'What to test: a branch, a tag, a commit, or refs/pull/<n>/head (empty: the ref the workflow runs from)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # The repo has no .gitattributes, and the runner's git converts to CRLF by
      # default: the .sh hooks and the files the tests read are LF-sensitive.
      # Must run before the checkout, which is when the files are written.
      - name: Keep line endings and long paths as committed
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      # npm test runs the tars-relay plugin's own tests through Python 3.9 or
      # later; on Windows the runner's Python answers to python and py -3.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # One command per step: pwsh on the runner exits with the step's last
      # native exit code only, so a chain would hide an earlier failure.
      - name: Install dependencies
        run: npm ci

      # npm ci leaves the Electron binary to its first use; fetched up front,
      # three tries: GitHub has answered that download 500 or 503.
      - name: Install the Electron binary
        shell: bash
        run: |
          for try in 1 2 3; do
            npx install-electron && exit 0
            echo "Electron's download failed (try $try of 3), trying again in 30 s"
            sleep 30
          done
          exit 1

      # Each check runs even when one before it failed, so one run says all it can.
      - name: Type check (renderer)
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Type check (main process)
        if: ${{ !cancelled() }}
        run: npx tsc -p electron/tsconfig.json

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      # The runner's display is 1024x768; the specs that capture and click the
      # real screen need their window on it (.github/scripts/display-resolution.ps1).
      - name: A 1920x1080 display
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/scripts/display-resolution.ps1 -Width 1920 -Height 1080

      - name: Platform specs
        if: ${{ !cancelled() }}
        env:
          E2E_TRACE: 'on'
        run: npm run e2e:platform

      - name: Upload the run artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-platform-windows
          path: test-results/runs/**
          retention-days: 7
